<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murano CRM — Заявки</title>
    <link rel="stylesheet" href="css/crm.css">
</head>
<body>
    <header class="crm-header">
        <div class="logo">Murano CRM <span>управление магазином</span></div>
        <nav class="crm-nav">
            <a href="index.html" class="nav-link">📊 Дашборд</a>
            <a href="orders.html" class="nav-link active">📋 Заявки</a>
            <a href="products.html" class="nav-link">🏷️ Товары</a>
            <a href="chat.html" class="nav-link">💬 Чат</a>
            <a href="settings.html" class="nav-link">⚙️ Настройки</a>
        </nav>
    </header>
    
    <main class="crm-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
            <h1>Заявки</h1>
            <button class="btn btn-primary" onclick="openLeadModal()">+ Новая заявка</button>
        </div>
        
        <!-- Фильтры -->
        <div style="display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;">
            <select id="status-filter" class="btn btn-outline" style="padding: 8px 16px;" onchange="filterLeads()">
                <option value="all">Все статусы</option>
                <option value="new">🆕 Новые</option>
                <option value="processing">⏳ В обработке</option>
                <option value="completed">✅ Завершённые</option>
                <option value="cancelled">❌ Отменённые</option>
            </select>
            <input type="text" id="search-input" placeholder="🔍 Поиск по имени, телефону, email..." style="padding: 8px 16px; border: 1px solid #ddd; border-radius: 8px; width: 250px;" onkeyup="filterLeads()">
            <button class="btn btn-outline" onclick="resetFilters()">Сбросить</button>
        </div>
        
        <!-- Таблица заявок -->
        <div class="table-wrapper" style="overflow-x: auto;">
            <table style="width: 100%; min-width: 1200px;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>ФИО</th>
                        <th>Телефон</th>
                        <th>Email</th>
                        <th>Товары</th>
                        <th>Доставка</th>
                        <th>Адрес</th>
                        <th>Сумма</th>
                        <th>Статус</th>
                        <th>Оплата</th>
                        <th>Дата/Время</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="leads-table-body">
                    <tr><td colspan="12">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
        
        <!-- Блок пагинации -->
        <div id="pagination-container" style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; flex-wrap: wrap; gap: 12px;">
            <div style="font-size: 13px; color: #666;">
                Показано <span id="pagination-start">0</span> - <span id="pagination-end">0</span> из <span id="pagination-total">0</span> заявок
            </div>
            <div style="display: flex; gap: 8px;">
                <button id="prev-page" class="btn btn-outline btn-sm" onclick="changePage(-1)" disabled>◀ Назад</button>
                <span id="page-numbers" style="display: flex; gap: 6px;"></span>
                <button id="next-page" class="btn btn-outline btn-sm" onclick="changePage(1)">Вперед ▶</button>
            </div>
            <div>
                <select id="per-page-select" class="btn btn-outline btn-sm" onchange="changePerPage()" style="padding: 6px 12px;">
                    <option value="5">5 на странице</option>
                    <option value="10" selected>10 на странице</option>
                    <option value="20">20 на странице</option>
                    <option value="50">50 на странице</option>
                </select>
            </div>
        </div>
    </main>
    
    <!-- Модальное окно для редактирования/добавления заявки -->
    <div id="lead-modal" class="modal">
        <div class="modal-content" style="max-width: 700px;">
            <div class="modal-header">
                <h3 id="modal-title">Новая заявка</h3>
                <span class="modal-close" onclick="closeModal()">&times;</span>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>
    
    <script src="js/crm-core.js"></script>
    <script src="js/orders.js"></script>
</body>
</html>
